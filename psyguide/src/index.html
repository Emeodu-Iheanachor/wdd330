<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Search PsyGuide for mental wellness topics, including stress, anxiety, sleep, and emotional wellbeing.">

    <title>PsyGuide | Search</title>


    <!-- =========================
         CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="../css/base.css">

    <link
        rel="stylesheet"
        href="../css/layout.css">

    <link
        rel="stylesheet"
        href="../css/navigation.css">

    <link
        rel="stylesheet"
        href="../css/cards.css">

    <link
        rel="stylesheet"
        href="../css/footer.css">

    <link
        rel="stylesheet"
        href="../css/responsive.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header></header>


    <main class="container">

        <!-- =========================
             SEARCH PAGE
        ========================== -->

        <section class="search-page">

            <div class="section-heading">

                <h1>
                    Search Mental Wellness Topics
                </h1>

                <p>
                    Search for information about stress,
                    anxiety, sleep, and other wellness topics.
                </p>

            </div>


            <!-- SEARCH FORM -->

            <form
                id="searchForm"
                class="search-form">

                <label for="search">
                    Search mental wellness topics
                </label>


                <input
                    type="search"
                    id="search"
                    name="search"
                    placeholder="Search stress, anxiety, sleep..."
                    aria-label="Search mental wellness topics"
                    autocomplete="off">


                <button type="submit">
                    Search
                </button>

            </form>


            <!-- SEARCH SUGGESTIONS -->

            <div
                id="searchSuggestions"
                class="search-suggestions"
                aria-live="polite">
            </div>


            <!-- SEARCH RESULTS -->

            <section
                aria-labelledby="searchResultsHeading">

                <h2 id="searchResultsHeading">
                    Search Results
                </h2>


                <div
                    id="searchResults"
                    class="category-grid">
                </div>

            </section>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="container">

            <p>
                &copy; 2026 PsyGuide.
                All rights reserved.
            </p>


            <nav aria-label="Footer navigation">

                <a href="../about/">
                    About
                </a>


                <a href="../resources/">
                    Resources
                </a>


                <a href="../categories/">
                    Categories
                </a>

            </nav>

        </div>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="../js/navigation.js">
    </script>

    <script
        type="module"
        src="../js/search.js">
    </script>

</body>

</html>
