<body>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header></header>


    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="container">


        <!-- =================================================
             LOADING SCREEN
        ================================================== -->

        <div
            id="loadingScreen"
            class="loading-screen">

            <div
                class="loader"
                aria-hidden="true">
            </div>

            <p>
                Loading topic...
            </p>

        </div>


        <!-- =================================================
             BREADCRUMB
        ================================================== -->

        <nav
            class="breadcrumb"
            aria-label="Breadcrumb">

            <a href="../index.html">
                Home
            </a>

            <span aria-hidden="true">
                ›
            </span>

            <a href="../categories/index.html">

            </a>

            <span aria-hidden="true">
                ›
            </span>

            <span
                id="breadcrumbTitle"
                aria-current="page">

                Loading...

            </span>

        </nav>


        <!-- =================================================
             TOPIC HEADER
        ================================================== -->

        <header class="topic-header">


            <!-- =================================================
                 TOPIC ICON
            ================================================== -->

            <div
                class="topic-icon"
                id="topicIcon"
                aria-hidden="true">

                🧠

            </div>


            <div>

                <h1 id="topicTitle">
                    Loading...
                </h1>

                <p
                    id="topicDescription"
                    aria-live="polite">

                    Please wait...

                </p>

            </div>

        </header>

        ================================================== -->

        <section
            class="quick-actions"
            aria-label="Topic actions">

                type="button"
                id="favoriteBtn">

            </button>

                type="button"
                id="shareBtn">

            </button>


            <button
                type="button"
                id="backBtn">

                ← Back to Categories

            </button>

        </section>

             DEFINITION
        ================================================== -->

        <section
            class="detail-card"
            aria-labelledby="definition-heading">

            <h2 id="definition-heading">
                Definition
            </h2>

            <p
                id="definition"
                aria-live="polite">

                Loading...

            </p>

        </section>


        <!-- =================================================
             SYMPTOMS
        ================================================== -->

        <section
            class="detail-card"
            aria-labelledby="symptoms-heading">

            <h2 id="symptoms-heading">
                Common Symptoms
            </h2>

            <ul
                id="symptoms"
                aria-live="polite">

             CAUSES
        ================================================== -->

            class="detail-card"
            aria-labelledby="causes-heading">

            <ul
                id="causes"
                aria-live="polite">
            </ul>

        ================================================== -->

            class="detail-card"
            aria-labelledby="treatment-heading">

            <h2 id="treatment-heading">

            </h2>

                id="treatment"
                aria-live="polite">
            </ul>

        </section>

            class="detail-card"

            </h2>

                id="prevention"

        ================================================== -->

            class="detail-card"
            aria-labelledby="related-topics-heading">

                id="relatedTopics"
                class="related-topics"
                aria-live="polite">

                <p>
                    Loading related topics...
                </p>

            </div>
