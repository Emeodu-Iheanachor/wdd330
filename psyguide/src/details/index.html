<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PsyGuide | Topic Details</title>

    <link rel="stylesheet" href="/src/css/base.css">
    <link rel="stylesheet" href="/src/css/layout.css">
    <link rel="stylesheet" href="/src/css/navigation.css">
    <link rel="stylesheet" href="/src/css/details.css">
    <link rel="stylesheet" href="/src/css/footer.css">
    <link rel="stylesheet" href="/src/css/responsive.css">
</head>

<body>

<header></header>

<main class="container">
<!-- Loading Overlay -->
<div id="loadingScreen" class="loading-screen">

    <div class="loader"></div>

    <p>Loading topic...</p>

</div>


    <!-- Breadcrumb -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Home</a>
        <span>›</span>
        <a href="../categories/index.html">Categories</a>
        <span>›</span>
        <span id="breadcrumbTitle">Loading...</span>
    </nav>

    <!-- Topic Header -->
    <section class="topic-header">

        <div class="topic-icon" id="topicIcon">
            🧠
        </div>

        <div>

            <h1 id="topicTitle">
                Loading...
            </h1>

            <p id="topicDescription">
                Please wait...
            </p>

        </div>

    </section>

    <!-- Quick Actions -->
    <section class="quick-actions">

        <button id="favoriteBtn">
            ❤️ Add to Favorites
        </button>

        <button id="shareBtn">
            🔗 Share
        </button>

        <button id="backBtn">
            ← Back to Categories
        </button>

    </section>

    <!-- Definition -->
    <section class="detail-card">

        <h2>Definition</h2>

        <p id="definition">
            Loading...
        </p>

    </section>

    <!-- Symptoms -->
    <section class="detail-card">

        <h2>Common Symptoms</h2>

        <ul id="symptoms">
        </ul>

    </section>

    <!-- Causes -->
    <section class="detail-card">

        <h2>Possible Causes</h2>

        <ul id="causes">
        </ul>

    </section>

    <!-- Treatment -->
    <section class="detail-card">

        <h2>Treatment</h2>

        <ul id="treatment">
        </ul>

    </section>

    <!-- Prevention -->
    <section class="detail-card">

        <h2>Prevention</h2>

        <ul id="prevention">
        </ul>

    </section>

    <!-- Resources -->
    <section class="detail-card">

        <h2>Helpful Resources</h2>

        <ul id="resources">
        </ul>

    </section>

    <!-- Related Topics -->
<section class="detail-card">

    <h2>Related Topics</h2>

    <div id="relatedTopics" class="related-topics">

        <p>Loading related topics...</p>

    </div>

</section>


</main>

<footer></footer>

<script type="module" src="/js/details.js"></script>

</body>
</html>
