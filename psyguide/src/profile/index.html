<html lang="en">

<head>

    <!-- =================================================
         DOCUMENT INFORMATION
    ================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Manage your PsyGuide profile and personalize your mental wellness experience.">

    <meta
        name="author"
        content="Emeodu Raphael Chidiebere Iheanachor">

    <meta
        name="robots"
        content="index, follow">

    <meta
        name="theme-color"
        content="#176b87">


    <!-- =================================================
         PAGE TITLE
    ================================================== -->

    <title>
        PsyGuide | Profile
    </title>


    <!-- =================================================
         OPEN GRAPH
         Facebook | LinkedIn | WhatsApp
    ================================================== -->

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:site_name"
        content="PsyGuide">

    <meta
        property="og:title"
        content="PsyGuide | Profile">

    <meta
        property="og:description"
        content="Manage your PsyGuide profile and personalize your mental wellness experience.">

    <meta
        property="og:url"
        content="https://emeodu-iheanachor.github.io/wdd330/psyguide/profile/">

    <meta
        property="og:image"
        content="https://emeodu-iheanachor.github.io/wdd330/psyguide/images/psyguide-preview.jpg">

    <meta
        property="og:image:alt"
        content="PsyGuide user profile">

    <meta
        property="og:locale"
        content="en_US">


    <!-- =================================================
         X / TWITTER CARD
    ================================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image">

    <meta
        name="twitter:title"
        content="PsyGuide | Profile">

    <meta
        name="twitter:description"
        content="Manage your PsyGuide profile and personalize your mental wellness experience.">

    <meta
        name="twitter:image"
        content="https://emeodu-iheanachor.github.io/wdd330/psyguide/images/psyguide-preview.jpg">

    <meta
        name="twitter:image:alt"
        content="PsyGuide user profile">


    <!-- =================================================
         FAVICON
    ================================================== -->

    <link
        rel="icon"
        type="image/x-icon"
        href="../images/favicon.ico">


    <!-- =================================================
         CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="../css/base.css">

    <link
        rel="stylesheet"
        href="../css/layout.css">

    <link
        rel="stylesheet"
        href="../css/navigation.css">

    <link
        rel="stylesheet"
        href="../css/cards.css">

    <link
        rel="stylesheet"
        href="../css/footer.css">

    <link
        rel="stylesheet"
        href="../css/responsive.css">

    <link
        rel="stylesheet"
        href="../css/profile.css">

    <link
        rel="stylesheet"
        href="../css/style.css">


</head>


<body>


    <!-- =================================================
         HEADER
    ================================================== -->

    <header></header>


    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="container">


        <!-- =================================================
             PROFILE PAGE HEADER
        ================================================== -->

        <header class="page-header">

            <h1>
                My Profile
            </h1>

            <p>
                Manage your PsyGuide preferences
                and saved activity.
            </p>

        </header>


        <!-- =================================================
             PROFILE INFORMATION
        ================================================== -->

        <section
            class="profile-card"
            aria-labelledby="profile-information-heading">

            <h2 id="profile-information-heading">
                Profile Information
            </h2>


            <!-- =================================================
                 PROFILE FORM
            ================================================== -->

            <form
                id="profileForm">


                <!-- =================================================
                     NAME
                ================================================== -->

                <div class="form-group">

                    <label for="profileName">
                        Name
                    </label>


                    <input
                        type="text"
                        id="profileName"
                        name="profileName"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required>

                </div>


                <!-- =================================================
                     SAVE PROFILE
                ================================================== -->

                <button
                    type="submit"
                    class="profile-save-button">

                    Save Profile

                </button>


                <!-- =================================================
                     PROFILE MESSAGE
                ================================================== -->

                <p
                    id="profileMessage"
                    class="profile-message"
                    aria-live="polite">
                </p>


            </form>

        </section>


    </main>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer></footer>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <!-- Common functionality -->

    <script
        type="module"
        src="../js/main.js">
    </script>


    <!-- Profile page functionality -->

    <script
        type="module"
        src="../js/profile.js">
    </script>


</body>

</html>
