<header class="site-header">

    <div class="container header-container">

        <!-- =========================
             LOGO
        ========================== -->

        <a
            href="/"
            class="logo"
            aria-label="PsyGuide Home">

            <img
                src="/images/logo.jpg"
                alt="PsyGuide"
                class="logo-image">

        </a>


        <!-- =========================
             MOBILE MENU BUTTON
        ========================== -->

        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="main-navigation">

            <span aria-hidden="true">☰</span>

        </button>


        <!-- =========================
             NAVIGATION
        ========================== -->

        <nav
            id="main-navigation"
            class="main-nav"
            aria-label="Main navigation">

            <a
                href="/"
                data-page="home">
                Home
            </a>

            <a
                href="/categories/"
                data-page="categories">
                Categories
            </a>

            <a
                href="/search/"
                data-page="search">
                Search
            </a>

            <a
                href="/favorites/"
                data-page="favorites">
                Favorites
            </a>

            <a
                href="/resources/"
                data-page="resources">
                Resources
            </a>

            <a
                href="/about/"
                data-page="about">
                About
            </a>

            <a
                href="/profile/"
                data-page="profile">
                Profile
            </a>

        </nav>

    </div>

</header>
