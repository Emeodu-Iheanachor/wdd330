name: Deploy WDD330 to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  # =========================================================
  # BUILD
  # =========================================================

  build:

    runs-on: ubuntu-latest

    steps:

      # =======================================================
      # Checkout Repository
      # =======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =======================================================
      # Setup Node.js
      # =======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: psyguide/package-lock.json


      # =======================================================
      # Install PsyGuide Dependencies
      # =======================================================

      - name: Install PsyGuide dependencies
        working-directory: ./psyguide
        run: npm ci


      # =======================================================
      # Build PsyGuide
      # =======================================================

      - name: Build PsyGuide
        working-directory: ./psyguide
        run: npm run build:github


      # =======================================================
      # Configure GitHub Pages
      # =======================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # =======================================================
      # Create Pages Directory
      # =======================================================

      - name: Create Pages directory
        run: |
          mkdir -p ./dist


      # =======================================================
      # Copy Existing WDD330 Site
      # =======================================================

      - name: Copy existing WDD330 site
        run: |
          find . \
            -maxdepth 1 \
            -type f \
            ! -name "package.json" \
            ! -name "package-lock.json" \
            ! -name "vite.config.js" \
            ! -name "README.md" \
            -exec cp {} ./dist/ \;

          for directory in css js images data fonts assets; do
            if [ -d "./$directory" ]; then
              cp -r "./$directory" "./dist/"
            fi
          done


      # =======================================================
      # Copy PsyGuide
      # =======================================================

      - name: Copy PsyGuide to /psyguide/
        run: |
          mkdir -p ./dist/psyguide
          cp -r ./psyguide/dist/. ./dist/psyguide/


      # =======================================================
      # Upload GitHub Pages Artifact
      # =======================================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  # ===========================================================
  # DEPLOY
  # ===========================================================

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
